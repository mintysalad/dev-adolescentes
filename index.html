<!DOCTYPE html>
<html lang="pt-BR">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Aula 2</title>

</head>
<body>


    <h3>Formulário</h3>
    <form action="">
        <legend>Dados Pessoais</legend>
        <br><br>
        <label for="nome"><div>Nome:</div></label>
        <input type="text" id="nome" required placeholder="Digite seu nome...">
        <br><br>
        <form action="">
            <label for="sobrenome"><div>Sobrenome:</div></label>
            <input type="text" id="sobrenome" required placeholder="Digite seu sobrenome...">
        </form>
        <br><br>
        <form action="">
            <label for="idade"><div>Idade:</div></label>
            <input type="number" id="idade" required placeholder="Digite sua idade...">
        </form>
    </form>
    

</body>
</html>
